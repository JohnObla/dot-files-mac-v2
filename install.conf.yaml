- defaults:
    link:
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ["~"]

- link:
    ~/.config:
    ~/.gitconfig:
    # z profile is needed to find brew in path
    ~/.zprofile:
    ~/.zshrc:
    ~/.wezterm.lua:
    ~/.Brewfile:

- shell:
    - description: Install Homebrew
      command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

    - description: Detect architecture and set Homebrew path
      command: |
        if [[ "$(uname -m)" == "arm64" ]]; then
          eval "$(/opt/homebrew/bin/brew shellenv)"
        else
          eval "$(/usr/local/bin/brew shellenv)"
        fi

    - description: Install Homebrew packages
      command: brew bundle install --global

    - description: Install latest Node.js
      command: n lts

    - description: Install npm packages
      command: npm install --global \
        all-the-package-names \
        yarn \
        diff-so-fancy \
        neovim \
        tree-sitter-cli

    - description: Login to GitHub CLI if not logged in already
      command: ~/.dotfiles/scripts/github_auth_check.sh
