# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits (vim-style)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Resize mode (like winresizer)
bind C-e switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Join mode (pull windows into current pane)
bind C-j switch-client -T join
bind -T join j choose-tree 'set -g @join_source "%%" ; switch-client -T join_orient'
bind -T join e break-pane
bind -T join Escape switch-client -T root

# Join orientation (after picking source window)
bind -T join_orient s run 'tmux join-pane -v -s "$(tmux show -gv @join_source)"'
bind -T join_orient v run 'tmux join-pane -h -s "$(tmux show -gv @join_source)"'
bind -T join_orient Escape switch-client -T root

# Close pane (with confirmation, y or Enter to confirm)
bind Q confirm-before -p "kill-pane #P? (y/Enter)" -y kill-pane

# Reload config
bind r switch-client -T reload
bind -T reload r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Vi mode for copy-mode
setw -g mode-keys vi

# 1-indexed windows and panes
set -g base-index 1
setw -g pane-base-index 1
